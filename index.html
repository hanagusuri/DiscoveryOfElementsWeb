<body>
<header id="top">
  <div class="brand">
    <div class="era" id="eraName"></div>
    <div class="era-sub" id="eraSub"></div>
  </div>
  <div class="pt"><span>知識</span><b id="pt">0</b></div>
  <div class="pt gold"><span>資金</span><b id="goldChip">∞</b></div>
  <div class="bar"><i id="eraBar"></i></div>
</header>

<main>
  <section id="tab-lab" class="panel">
    <div class="labtop" id="labtop">
      <div class="bench" id="bench">
        <div class="slots" id="slots"></div>
        <div class="flask" id="flask" aria-hidden="true">⚗️</div>
      </div>
      <div class="actions">
        <button id="btnRun" class="primary">実験する</button>
        <button id="btnClear">クリア</button>
        <button id="btnHint">ヒント <small>-3</small></button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="log" id="log"></div>
    </div>
    <div class="cond" id="cond"></div>
    <div class="cond proc" id="proc"></div>
    <div class="grid" id="inv"></div>
  </section>

  <section id="tab-tech" class="panel" hidden>
    <p class="lead">発見した知識を使って、新しい探索や道具を開放しよう。</p>
    <div id="techList"></div>
  </section>

  <section id="tab-table" class="panel" hidden>
    <div class="lead" id="tableLead"></div>
    <div id="tableWrap"></div>
  </section>

  <section id="tab-mol" class="panel" hidden>
    <div id="molBody"></div>
  </section>

  <section id="tab-ind" class="panel" hidden>
    <div id="indBody"></div>
  </section>

  <section id="tab-codex" class="panel" hidden>
    <div class="lead" id="codexCount"></div>
    <div id="codex"></div>
    <div id="fxSettings"></div>
    <div class="langsw" id="langSw"><span>🌐 Language / 言語</span><button data-lang="ja">日本語</button><button data-lang="en">English</button></div>
    <button id="btnCheat" class="cheat"></button>
    <!-- ADMIN-LINK-START: 管理者用リンク。公開版では、この3行(コメントとリンク)を削除する -->
    <a id="adminLink" class="adminlink" href="admin.html" target="_blank" rel="noopener">🛠 管理者ビューを開く(反応・生成リスト/ツリー図)</a>
    <!-- ADMIN-LINK-END -->
    <button id="btnExport" class="cheat">セーブデータを書き出す(JSON)</button>
    <button id="btnReset" class="danger">セーブデータを消去</button>
  </section>
</main>

<nav id="tabs">
  <button data-tab="lab" class="on">🧪<span>実験室</span></button>
  <button data-tab="tech" >🏛️<span>技術</span></button>
  <button data-tab="table">⚛️<span>周期表</span></button>
  <button data-tab="mol">🧬<span>化学</span></button>
  <button data-tab="ind">🏭<span>産業</span></button>
  <button data-tab="codex">📖<span>図鑑</span></button>
</nav>

<div id="modal" class="modal" hidden>
  <div class="card" id="card"></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  I18N.dom(document.body); // 最初からある文言を訳す
  document.querySelectorAll("#langSw button").forEach(function (b) {
    if (b.dataset.lang === I18N.lang) b.classList.add("on");
    b.onclick = function () { if (b.dataset.lang !== I18N.lang) I18N.set(b.dataset.lang); };
  });
})();
</script>
<script>
(function () {
  var top = document.getElementById("top");
  function set() { document.documentElement.style.setProperty("--hdr", top.offsetHeight + "px"); }
  set(); window.addEventListener("resize", set); window.addEventListener("load", set);
  if (window.ResizeObserver) new ResizeObserver(set).observe(top);
})();
</script>

</html>

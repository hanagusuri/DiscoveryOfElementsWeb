<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>分子ラボ 3D(プロトタイプ)</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#12141c; --panel:#1b1f2b; --panel2:#232838; --line:#2d3348; --text:#ece6d8; --dim:#8d93a8; --accent:#e8a33d; --accent2:#6ec1b0; --hot:#ff8a3d; --cold:#5cc8ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:-apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; font-size:15px; line-height:1.5; max-width:760px; margin:0 auto; padding:12px 14px 40px; }
  h1 { font-size:17px; margin:4px 0 10px; letter-spacing:.04em; }
  h1 small { color:var(--dim); font-weight:normal; font-size:12px; margin-left:8px; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; }
  .tabs button, .btn { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 14px; font:inherit; cursor:pointer; }
  .tabs button.on, .btn.on { border-color:var(--accent); color:var(--accent); background:#2a2618; }
  .stage { position:relative; background:radial-gradient(ellipse at 50% 40%, #232a40 0%, #141722 70%); border:1px solid var(--line); border-radius:14px; overflow:hidden; touch-action:none; }
  canvas { display:block; width:100%; }
  .caption { position:absolute; left:10px; right:10px; top:8px; pointer-events:none; text-shadow:0 1px 4px #000; }
  .caption b { font-size:15px; } .caption div { font-size:12.5px; color:#c9cde0; }
  .hint { position:absolute; right:10px; bottom:6px; font-size:11px; color:var(--dim); pointer-events:none; }
  .steps { display:flex; gap:4px; margin:10px 0; }
  .steps span { flex:1; text-align:center; font-size:11px; padding:5px 2px; border-radius:8px; background:var(--panel); color:var(--dim); border:1px solid var(--line); }
  .steps span.on { color:var(--text); border-color:var(--accent); background:#2a2618; }
  .steps span.cold.on { border-color:var(--cold); background:#14283a; }
  .steps span.hot.on { border-color:var(--hot); background:#33200f; }
  .ctl { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0; }
  .ctl input[type=range] { flex:1; min-width:140px; accent-color:var(--accent); }
  .ctl label { font-size:13px; color:var(--dim); display:flex; align-items:center; gap:4px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-top:10px; }
  .card h2 { font-size:13px; color:var(--dim); margin:0 0 6px; font-weight:normal; }
  .ledger { display:grid; grid-template-columns:1fr auto; gap:2px 12px; font-size:14px; font-variant-numeric:tabular-nums; }
  .ledger .v { text-align:right; }
  .cold { color:var(--cold); } .hotc { color:var(--hot); }
  .total { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); font-size:16px; }
  .note { font-size:12px; color:var(--dim); margin-top:8px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chips button { min-width:46px; padding:6px 10px; }
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:var(--dim); margin-top:8px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
  .hidden { display:none !important; }
  body.embed h1 { display:none; } body.embed { padding-top:44px; }
  .grid2 { display:grid; grid-template-columns:repeat(2,1fr); gap:2px 12px; font-size:14px; }
</style>
</head>
<body>
<h1>分子ラボ 3D<small>プロトタイプ / Level 1</small></h1>
<div class="tabs">
  <button id="tabRx" class="on">⚗️ 反応</button>
  <button id="tabAt">⚛️ 原子</button>
</div>

<!-- ===== 反応ビュー ===== -->
<section id="viewRx">
  <div class="chips" id="rxChips"></div>
  <div class="ctl" style="margin-top:0"><span style="font-size:13px;color:var(--dim)">表示</span><button class="btn on" id="stBS">ボール&スティック</button><button class="btn" id="stSF">空間充填</button><button class="btn" id="stST">スティック</button></div>
  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="caption"><b id="capT"></b><div id="capS"></div></div>
    <div class="hint">ドラッグで回転 / ホイールで拡大 / 原子をタップ → 原子の中身</div>
  </div>
  <div class="steps" id="steps"></div>
  <div class="ctl">
    <button class="btn" id="play">⏸</button>
    <button class="btn" id="replay">⟲</button>
    <input type="range" id="seek" min="0" max="1000" value="0">
    <button class="btn on" id="sp1">1×</button><button class="btn" id="sp2">2×</button><button class="btn" id="sp05">0.5×</button>
  </div>
  <div class="ctl">
    <label><input type="checkbox" id="optE" checked>共有電子を表示</label>
    <label><input type="checkbox" id="optSpin" checked>自動回転</label>
  </div>
  <div class="card">
    <h2>エネルギーの出入り(1 mol あたり)</h2>
    <canvas id="chart" style="height:170px"></canvas>
    <div class="ledger" style="margin-top:8px">
      <div class="cold">結合を切るために吸収</div><div class="v cold" id="lgIn">0 kJ</div>
      <div class="hotc">結合ができて放出</div><div class="v hotc" id="lgOut">0 kJ</div>
    </div>
    <div class="ledger total"><div>差し引き(反応熱)</div><div class="v" id="lgNet">0 kJ</div></div>
    <div class="note" id="rxNote"></div>
  </div>
  <div class="legend">
    <span><i style="background:#f4f4f4"></i>水素</span><span><i style="background:#e34234"></i>酸素</span>
    <span><i style="background:#ffd84a"></i>電子</span><span><i style="background:#5cc8ff"></i>吸収するエネルギー</span><span><i style="background:#ff8a3d"></i>放出される熱</span>
  </div>
</section>

<!-- ===== 原子ビュー ===== -->
<section id="viewAt" class="hidden">
  <div class="chips" id="elChips"></div>
  <div class="ctl"><button class="btn on" id="mdBohr">ボーア模型(軌道を回る粒)</button><button class="btn" id="mdCloud">電子雲(見つかりやすさ)</button></div>
  <div class="stage">
    <canvas id="cvAt"></canvas>
    <div class="caption"><b id="atT"></b><div id="atS"></div></div>
    <div class="hint">ドラッグで回転 / ホイールで拡大</div>
  </div>
  <div class="card">
    <div class="grid2">
      <div><span style="color:#ff6b6b">●</span> 陽子 <b id="nP"></b></div>
      <div><span style="color:#9aa4bd">●</span> 中性子 <b id="nN"></b></div>
      <div><span style="color:#5cc8ff">●</span> 電子 <b id="nE"></b></div>
      <div><span style="color:#ffd84a">●</span> 最外殻の電子 <b id="nV"></b></div>
      <div style="grid-column:1/3">電子配置 <b id="cfg"></b>　電荷 <b id="chg"></b></div>
    </div>
    <div class="ctl" style="margin-bottom:0"><button class="btn hidden" id="ionBtn"></button></div>
    <div class="note" id="atNote"></div>
    <div class="note">※ 原子核は、実際は原子の約10万分の1の大きさ。見やすいよう大きく描いています。電子も、実際は軌道を回る粒ではなく、雲のように広がっています(教育用のボーア模型)。</div>
  </div>
</section>

<script src="molviz.js"></script>
<script src="lab3d.js"></script>
</body>
</html>

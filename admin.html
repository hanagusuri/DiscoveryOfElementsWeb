<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Elements of Discovery - 管理者ビュー</title>
<style>
  :root { --bg:#12141c; --panel:#1b1f2b; --panel2:#232838; --line:#2d3348; --text:#ece6d8; --dim:#8d93a8; --accent:#e8a33d; --accent2:#6ec1b0; --blue:#6aa6ff; --orange:#ff9a5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.5 -apple-system,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif; }
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line); padding:8px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 8px 0 0; color:var(--accent); }
  header a { color:var(--dim); font-size:12px; }
  nav { display:flex; gap:4px; flex-wrap:wrap; }
  button, select, input { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 10px; }
  button { cursor:pointer; } button.on { background:var(--accent); color:#1a1405; border-color:var(--accent); font-weight:700; }
  main { padding:14px; max-width:1500px; margin:0 auto; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .bar input[type=search] { min-width:240px; }
  .muted { color:var(--dim); } small { color:var(--dim); }
  table { border-collapse:collapse; width:100%; }
  th, td { padding:5px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { position:sticky; top:46px; background:var(--panel); cursor:pointer; user-select:none; white-space:nowrap; z-index:3; font-weight:600; color:var(--accent2); }
  tr:hover td { background:#ffffff08; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; border:1px solid var(--line); background:var(--panel2); margin:1px 2px; cursor:pointer; white-space:nowrap; }
  .pill:hover { border-color:var(--accent); }
  .t-material { border-color:#8d93a8; } .t-compound { border-color:#b0803c; } .t-tool { border-color:#4b6a9a; } .t-element { border-color:#3e8a7a; } .t-concept { border-color:#7c5aa8; }
  .eq { color:var(--dim); font-size:11.5px; }
  .chip { display:inline-block; font-size:11px; padding:0 6px; border-radius:4px; background:#2d3348; color:#cfd3dc; margin:1px; }
  .chip.warn { background:#5a3a2a; color:#ffcf9a; } .chip.eqp { background:#27405a; color:#bfe0ff; } .chip.ok { background:#234a3e; color:#a8f0d6; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:12px; }
  details { margin-left:16px; border-left:1px dashed var(--line); padding-left:8px; }
  details > summary { cursor:pointer; padding:2px 0; list-style-position:outside; } details > summary:hover { color:var(--accent); }
  .src { margin:4px 0 4px 6px; padding:4px 8px; background:#ffffff06; border-radius:6px; } .src b { color:var(--accent2); }
  .depth { display:inline-block; min-width:22px; text-align:center; background:#2d3348; border-radius:4px; font-size:11px; margin-right:4px; color:var(--accent); }
  ol.plan { margin:6px 0; padding-left:22px; } ol.plan li { margin:2px 0; }
  #map { width:100%; height:72vh; background:#0e1016; border:1px solid var(--line); border-radius:8px; cursor:grab; }
  #map text { font-size:11px; fill:#ece6d8; pointer-events:none; }
  #map .node { cursor:pointer; } #map .node rect { stroke-width:1; }
  .stat { display:inline-block; min-width:120px; background:var(--panel2); border-radius:8px; padding:6px 12px; margin:0 8px 8px 0; } .stat b { display:block; font-size:20px; color:var(--accent); }
  .grid2 { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:10px; }
  .pill.un { opacity:.42; border-style:dashed; } .pill.hv::after { content:" ✓"; color:var(--accent2); font-size:10px; }
  .bar2 { display:flex; gap:6px; align-items:center; } .prog { height:8px; background:#2d3348; border-radius:4px; overflow:hidden; min-width:120px; } .prog i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
  .legend span { margin-right:12px; } .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; vertical-align:-1px; }
</style>

  <h1>🧪 管理者ビュー</h1>
